name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.15.2
      - run: zig fmt --check build.zig src bench
      - name: Test synthetic backend with runtime safety
        run: zig build test -Dlibcamera=false -Djpeg=false
      - name: Build synthetic CLI and shared library
        run: zig build -Dlibcamera=false -Djpeg=false -Doptimize=ReleaseSafe
      - name: Verify C and Python ABI, lifecycle and CLI
        run: |
          cc -Wall -Wextra -Werror -Iinclude tests/abi.c -Lzig-out/lib -lzigcamera -o zig-out/abi-test
          env LD_LIBRARY_PATH=zig-out/lib DYLD_LIBRARY_PATH=zig-out/lib zig-out/abi-test
          PYTHONPATH=python python3 -m unittest discover -s tests -v
          ./zig-out/bin/zig-camera modes --simulate
          ./zig-out/bin/zig-camera capture --simulate --width 66 --height 34 --sensor-width 640 --sensor-height 480 --sensor-depth 12 --lores-width 18 --lores-height 10 --warmup 0 --output zig-out/lores.ppm
          python3 -c 'import json,pathlib; p=pathlib.Path("zig-out/lores.ppm"); m=json.loads(p.with_suffix(".ppm.json").read_text()); assert m["sensor_width"] == 640 and m["lores_width"] == 18; assert pathlib.Path(str(p)+".lores.i420").stat().st_size == 270'
          ./zig-out/bin/zig-camera capture --simulate --width 17 --height 9 --warmup 2 --output zig-out/test.ppm
          ./zig-out/bin/zig-camera bench --simulate --width 640 --height 480 --frames 100 --warmup 2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcamera-dev libjpeg-dev pkg-config python3-pil
      - name: Native Home media and SDL dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libsdl2-dev python3-tifffile libraw-bin mkvtoolnix
      - name: Test Home media, Bayer DNG and SDL preview
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
          ZC_TEST_PREVIEW: '1'
        run: |
          zig build -Dlibcamera=false -Djpeg=false -Dpreview=true -Doptimize=ReleaseSafe
          PYTHONPATH=python python3 -m unittest discover -s tests -v
          ./zig-out/bin/zig-camera preview --simulate --width 65 --height 33 --frames 8 --warmup 0
          ./zig-out/bin/zig-camera capture --simulate --width 128 --height 96 --warmup 0 --output zig-out/home.jpg
          ./zig-out/bin/zig-camera capture --simulate --width 128 --height 96 --warmup 0 --output zig-out/test.dng
          ./zig-out/bin/zig-camera record --simulate --width 128 --height 96 --frames 12 --fps 24 --warmup 0 --output zig-out/home.mkv
          python3 tests/check_media_files.py zig-out
          raw-identify zig-out/test.dng
      - name: Home AVC/HEVC and independent decoder dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libx264-dev libx265-dev libopenh264-dev libde265-dev
      - name: Test Home codecs and fragmented MP4 without FFmpeg
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
          ZC_TEST_PREVIEW: '1'
          ZC_TEST_CODECS: '1'
        run: |
          zig build test -Dlibcamera=false -Dcodecs=true
          zig build -Dlibcamera=false -Dcodecs=true -Dpreview=true -Doptimize=ReleaseSafe
          c++ -std=c++17 -Wall -Wextra -Werror tests/decode_codecs.cpp -lopenh264 -lde265 -o zig-out/decode-codecs
          ZC_INDEPENDENT_DECODER="$PWD/zig-out/decode-codecs" PYTHONPATH=python python3 -m unittest discover -s tests -v
          ./zig-out/bin/zig-camera record --simulate --codec h264 --width 128 --height 96 --frames 12 --fps 24 --gop 4 --quality 90 --warmup 0 --output zig-out/cli-h264.mp4
          ./zig-out/bin/zig-camera record --simulate --codec hevc --width 128 --height 96 --frames 12 --fps 24 --gop 4 --quality 90 --warmup 0 --output zig-out/cli-hevc.mp4
          PYTHONPATH=python python3 tests/test_codecs.py zig-out
          for clip in zig-out/home-*.mp4 zig-out/cli-*.mp4; do
            python3 tests/check_mp4.py "$clip" zig-out/decode-codecs
            mkvmerge -J "$clip" > "$clip.identify.json"
          done
      - name: Test native JPEG encoding with synthetic frames
        if: runner.os == 'Linux'
        run: |
          zig build -Dlibcamera=false -Djpeg=true -Doptimize=ReleaseSafe
          ./zig-out/bin/zig-camera capture --simulate --width 65 --height 33 --warmup 0 --output zig-out/test.jpg
          python3 tests/check_jpeg.py zig-out/test.jpg
      - name: Compile real libcamera backend and test platform-independent code
        if: runner.os == 'Linux'
        run: |
          zig build test -Dlibcamera=true -Djpeg=true
          zig build -Dlibcamera=true -Djpeg=true -Doptimize=ReleaseSafe
          PYTHONPATH=python python3 tests/native_smoke.py
