name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.15.2
      - name: Install pinned Bun without Python tooling
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash -s 'bun-v1.4.3'
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Linux dependencies and independent decoders
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcamera-dev libjpeg-dev pkg-config libsdl2-dev libraw-bin mkvtoolnix libx264-dev libx265-dev libopenh264-dev libde265-dev libasound2-dev libfaad-dev zlib1g-dev libpng-dev libtiff-dev
      - name: macOS image compression dependency
        if: runner.os == 'macOS'
        run: |
          brew install zlib pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix zlib)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      - name: Build independent image decoder
        shell: bash
        run: |
          mkdir -p zig-out
          if [ "$RUNNER_OS" = "macOS" ]; then
            cc -Wall -Wextra -Werror tests/decode_images.c -framework CoreGraphics -framework ImageIO -framework CoreFoundation -o zig-out/decode-images
          else
            cc -Wall -Wextra -Werror tests/decode_images.c $(pkg-config --cflags --libs libpng libtiff-4 sdl2 libjpeg) -o zig-out/decode-images
          fi
          echo "ZC_IMAGE_DECODER=$PWD/zig-out/decode-images" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: zig fmt --check build.zig src bench
      - name: Verify Python entry points have been removed
        run: test -z "$(git ls-files '*.py' '*requirements*.txt' pyproject.toml)"
      - name: Test synthetic backend with runtime safety
        run: zig build test -Dlibcamera=false -Djpeg=false
      - name: Build synthetic CLI and shared library
        run: zig build -Dlibcamera=false -Djpeg=false -Doptimize=ReleaseSafe
      - name: Verify C ABI, Bun lifecycle, native automation and CLI
        run: |
          cc -Wall -Wextra -Werror -Iinclude tests/abi.c -Lzig-out/lib -lzigcamera -o zig-out/abi-test
          env LD_LIBRARY_PATH=zig-out/lib DYLD_LIBRARY_PATH=zig-out/lib zig-out/abi-test
          bun test tests/ts
          ./zig-out/bin/zig-camera list --simulate
          ./zig-out/bin/zig-camera info --simulate --camera-id synthetic
          if ./zig-out/bin/zig-camera info --simulate --camera-id absent; then exit 1; fi
          if ./zig-out/bin/zig-camera info --simulate --camera-id synthetic --camera 0; then exit 1; fi
          ./zig-out/bin/zig-camera modes --simulate
          ./zig-out/bin/zig-camera info --simulate --rotation 90 --transpose --strict-transform
          ./zig-out/bin/zig-camera capture --simulate --width 3 --height 2 --fifo --hflip --strict-transform --warmup 0 --output zig-out/oriented.ppm
          bun tests/ts/check-media.ts zig-out --orientation
          for format in png bmp tiff; do
            ./zig-out/bin/zig-camera capture --simulate --width 17 --height 9 --fifo --warmup 0 --png-compression 1 --png-filter paeth --output "zig-out/cli-image.$format"
          done
          bun tests/ts/check-media.ts zig-out --still-images
          ./zig-out/bin/zig-camera capture --simulate --width 64 --height 48 --fifo --lores-width 18 --lores-height 10 --image-stream lores --warmup 0 --output zig-out/stream-i420.png
          ./zig-out/bin/zig-camera capture --simulate --width 64 --height 48 --fifo --lores-width 18 --lores-height 10 --lores-format BGR888 --image-stream lores --warmup 0 --output zig-out/stream-rgb.png
          bun tests/ts/check-media.ts zig-out --stream-images
          ./zig-out/bin/zig-camera record --simulate --width 64 --height 48 --lores-width 32 --lores-height 24 --record-stream lores --frames 4 --warmup 0 --output zig-out/lores-video.mkv
          bun tests/ts/check-media.ts zig-out --recording-streams
          if ./zig-out/bin/zig-camera record --simulate --record-stream lores --frames 1 --warmup 0 --output zig-out/disabled-video.mkv; then exit 1; fi
          if ./zig-out/bin/zig-camera record --simulate --record-stream raw --frames 1 --output zig-out/invalid-video.mkv; then exit 1; fi
          if ./zig-out/bin/zig-camera capture --simulate --image-stream raw --output zig-out/invalid.png; then exit 1; fi
          if ./zig-out/bin/zig-camera capture --simulate --image-stream main --output zig-out/invalid.dng; then exit 1; fi
          if ./zig-out/bin/zig-camera capture --simulate --png-compression 10 --output zig-out/invalid.png; then exit 1; fi
          if ./zig-out/bin/zig-camera info --simulate --rotation 45; then exit 1; fi
          ./zig-out/bin/zig-camera capture --simulate --width 66 --height 34 --sensor-width 640 --sensor-height 480 --sensor-depth 12 --lores-width 18 --lores-height 10 --warmup 0 --output zig-out/lores.ppm
          bun tests/ts/check-media.ts zig-out --lores
          ./zig-out/bin/zig-camera capture --simulate --width 17 --height 9 --warmup 2 --output zig-out/test.ppm
          ./zig-out/bin/zig-camera bench --simulate --width 640 --height 480 --frames 100 --warmup 2
          bun tests/ts/check-cli-rotation.ts
      - name: Build pinned standalone AAC codec
        if: runner.os == 'Linux'
        run: |
          git clone --filter=blob:none https://github.com/mstorsjo/fdk-aac.git "$RUNNER_TEMP/fdk-aac"
          git -C "$RUNNER_TEMP/fdk-aac" checkout --detach 716f4394641d53f0d79c9ddac3fa93b03a49f278
          cmake -S "$RUNNER_TEMP/fdk-aac" -B "$RUNNER_TEMP/fdk-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/fdk-build" -j 2
          sudo cmake --install "$RUNNER_TEMP/fdk-build"
          sudo ldconfig
      - name: Test Home media, independent decoders and SDL without FFmpeg
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
          ZC_TEST_PREVIEW: '1'
          ZC_TEST_CODECS: '1'
          ZC_TEST_AAC: '1'
        run: |
          zig build test -Dlibcamera=false -Dcodecs=true -Daudio=true -Daac=true -Dpreview=true
          zig build -Dlibcamera=false -Dcodecs=true -Dpreview=true -Daudio=true -Daac=true -Doptimize=ReleaseSafe
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/preview.c -Lzig-out/lib -lzigcamera $(pkg-config --cflags --libs sdl2) -o zig-out/preview-test
          LD_LIBRARY_PATH=zig-out/lib ./zig-out/preview-test
          c++ -std=c++17 -Wall -Wextra -Werror tests/decode_codecs.cpp -lopenh264 -lde265 -o zig-out/decode-codecs
          cc -std=c11 -Wall -Wextra -Werror tests/decode_aac.c -lfaad -o zig-out/decode-aac
          cc -std=c11 -Wall -Wextra -Werror tests/decode_jpeg.c -ljpeg -o zig-out/decode-jpeg
          ZC_AAC_DECODER="$PWD/zig-out/decode-aac" ZC_INDEPENDENT_DECODER="$PWD/zig-out/decode-codecs" bun test tests/ts
          ./zig-out/bin/zig-camera preview --simulate --width 65 --height 33 --frames 8 --warmup 0
          ./zig-out/bin/zig-camera preview --simulate --main-format YUV420 --width 64 --height 48 --frames 4 --warmup 0
          ./zig-out/bin/zig-camera capture --simulate --fifo --main-format YUV420 --width 64 --height 48 --warmup 0 --output zig-out/main-i420.png
          ./zig-out/bin/zig-camera record --simulate --fifo --main-format YUV420 --width 64 --height 48 --frames 4 --fps 25 --warmup 0 --output zig-out/main-i420.mkv
          ./zig-out/bin/zig-camera record --simulate --fifo --main-format YUV420 --width 64 --height 48 --frames 4 --fps 25 --codec h264 --warmup 0 --output zig-out/main-i420-h264.mp4
          ./zig-out/bin/zig-camera record --simulate --fifo --main-format YUV420 --width 64 --height 48 --frames 4 --fps 25 --codec hevc --warmup 0 --output zig-out/main-i420-hevc.mp4
          ZC_INDEPENDENT_DECODER="$PWD/zig-out/decode-codecs" bun tests/ts/check-media.ts zig-out --main-formats
          if ./zig-out/bin/zig-camera info --simulate --main-format YUV420 --width 65 --height 48; then exit 1; fi
          ./zig-out/bin/zig-camera preview --simulate --width 64 --height 48 --lores-width 16 --lores-height 12 --preview-stream lores --frames 4 --warmup 0
          ./zig-out/bin/zig-camera preview --simulate --width 64 --height 48 --lores-width 16 --lores-height 12 --lores-format BGR888 --preview-stream lores --frames 4 --warmup 0
          ./zig-out/bin/zig-camera preview --simulate --width 65 --height 33 --preview-stream none --frames 4 --warmup 0
          ./zig-out/bin/zig-camera record --simulate --width 64 --height 48 --lores-width 16 --lores-height 12 --preview --preview-stream lores --frames 4 --warmup 0 --output zig-out/lores-display.mkv
          if ./zig-out/bin/zig-camera preview --simulate --preview-stream lores --frames 1 --warmup 0; then exit 1; fi
          if ./zig-out/bin/zig-camera preview --simulate --preview-stream raw --frames 1 --warmup 0; then exit 1; fi
          ./zig-out/bin/zig-camera capture --simulate --width 128 --height 96 --warmup 0 --output zig-out/home.jpg
          ./zig-out/bin/zig-camera capture --simulate --width 128 --height 96 --warmup 0 --output zig-out/test.dng
          ./zig-out/bin/zig-camera record --simulate --width 128 --height 96 --frames 12 --fps 24 --warmup 0 --output zig-out/home.mkv
          ./zig-out/bin/zig-camera record --simulate --codec h264 --width 128 --height 96 --frames 12 --fps 24 --gop 4 --quality 90 --warmup 0 --output zig-out/cli-h264.mp4
          ./zig-out/bin/zig-camera record --simulate --codec hevc --width 128 --height 96 --frames 12 --fps 24 --gop 4 --quality 90 --warmup 0 --output zig-out/cli-hevc.mp4
          ZC_JPEG_DECODER="$PWD/zig-out/decode-jpeg" ZC_INDEPENDENT_DECODER="$PWD/zig-out/decode-codecs" bun tests/ts/check-media.ts zig-out
          raw-identify zig-out/test.dng
          mkvmerge -J zig-out/home.mkv
      - name: Verify optional system JPEG and real libcamera backend
        if: runner.os == 'Linux'
        run: |
          zig build -Dlibcamera=false -Djpeg=true -Doptimize=ReleaseSafe
          bun test tests/ts/still-images.test.ts tests/ts/stream-images.test.ts
          ./zig-out/bin/zig-camera capture --simulate --width 65 --height 33 --warmup 0 --output zig-out/test.jpg
          ZC_JPEG_DECODER="$PWD/zig-out/decode-jpeg" bun tests/ts/check-media.ts zig-out
          zig build test -Dlibcamera=true -Djpeg=true -Dcodecs=true -Daudio=true -Daac=true -Dpreview=true
          zig build -Dlibcamera=true -Djpeg=true -Dcodecs=true -Daudio=true -Daac=true -Dpreview=true -Doptimize=ReleaseSafe
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/catalog_bridge.cpp $(pkg-config --cflags --libs libcamera) -o zig-out/catalog-bridge-test
          ./zig-out/catalog-bridge-test
          ./zig-out/bin/zig-camera list
          bun tests/ts/native-smoke.ts
