name: Home JPEG decoding
on:
  push:
    branches: [main]
    paths: ['src/home/jpeg*.zig', 'src/jpeg_image.zig', 'ts/jpeg-decode.ts', 'tests/jpeg_decode*', 'tests/ts/jpeg-decode.test.ts', '.github/workflows/home-jpeg.yml']
  pull_request:
    paths: ['src/home/jpeg*.zig', 'src/jpeg_image.zig', 'ts/jpeg-decode.ts', 'tests/jpeg_decode*', 'tests/ts/jpeg-decode.test.ts', '.github/workflows/home-jpeg.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jpeg:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', master]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: home-lang/home
          ref: caec6bb024b856916b31f00fde5b082781ccead8
          path: .home-jpeg-upstream
          sparse-checkout: packages/image
          persist-credentials: false
      - name: Verify shared JPEG source and independent libjpeg corpus
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            brew install jpeg-turbo zlib
            jpeg=$(brew --prefix jpeg-turbo)
            zlib=$(brew --prefix zlib)
          else
            sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev
            jpeg=/usr
            zlib=/usr
          fi
          cmp .home-jpeg-upstream/packages/image/src/jpeg_decoder.zig src/home/jpeg_decoder.zig
          cmp .home-jpeg-upstream/packages/image/src/jpeg_dct.zig src/home/jpeg_dct.zig
          cmp .home-jpeg-upstream/packages/image/tests/jpeg_decode_fixture.zig tests/jpeg_decode_fixture.zig
          cmp .home-jpeg-upstream/packages/image/tests/jpeg_decode_libjpeg.c tests/jpeg_decode_libjpeg.c
          for mode in Debug ReleaseSafe; do
            zig build-obj -O "$mode" -fcompiler-rt -lc --dep jpeg -Mroot=tests/jpeg_decode_fixture.zig -Mjpeg=src/home/jpeg_decoder.zig -femit-bin=/tmp/jpeg-decode.o
            cc -std=c11 -O2 -Wall -Wextra -Werror -I"$jpeg/include" tests/jpeg_decode_libjpeg.c /tmp/jpeg-decode.o -L"$jpeg/lib" -Wl,-rpath,"$jpeg/lib" -ljpeg -o /tmp/jpeg-decode
            /tmp/jpeg-decode
            if ! zig test -O "$mode" src/home/jpeg_decoder.zig; then
              if [ '${{ matrix.os }}' = ubuntu-24.04 ] && [ '${{ matrix.zig }}' = '0.15.2' ]; then
                echo 'Comparing the same failing tests with LLVM code generation'
                zig test -fllvm -O "$mode" src/home/jpeg_decoder.zig
              fi
              exit 1
            fi
            zig test -O "$mode" .home-jpeg-upstream/packages/image/src/jpeg_decoder.zig
            if [ '${{ matrix.zig }}' = master ]; then
              zig test -O "$mode" -lc -lz -L"$zlib/lib" -rpath "$zlib/lib" .home-jpeg-upstream/packages/image/src/jpeg_encoder_tests.zig --test-filter JPEG
            fi
          done
