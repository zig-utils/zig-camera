name: Home shared memory
on:
  push:
    branches: [main]
    paths: ['src/home/descriptor_channel.zig', 'src/home/posix_shared_memory.zig', 'src/home/owned_admission.zig', '.github/workflows/home-shared-memory.yml']
  pull_request:
    paths: ['src/home/descriptor_channel.zig', 'src/home/posix_shared_memory.zig', 'src/home/owned_admission.zig', '.github/workflows/home-shared-memory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owners:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', 'master']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - name: Descriptor mapping and admission ownership
        shell: bash
        run: |
          set -euo pipefail
          for mode in Debug ReleaseSafe; do
            zig test -O "$mode" -lc src/home/posix_shared_memory.zig
            zig test -O "$mode" -lc src/home/descriptor_channel.zig
            zig test -O "$mode" src/home/owned_admission.zig
          done
