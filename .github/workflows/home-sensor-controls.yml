name: Home sensor controls
on:
  push:
    branches: [main]
    paths: ['src/home/manager_gate.zig', 'src/home/sensor_node.zig', 'src/home/boolean_control.zig', 'src/sensor_layout.zig', 'src/imx708*.zig', 'native/imx708_control.hpp', 'tests/imx708_ioctl.cpp', '.github/workflows/home-sensor-controls.yml']
  pull_request:
    paths: ['src/home/manager_gate.zig', 'src/home/sensor_node.zig', 'src/home/boolean_control.zig', 'src/sensor_layout.zig', 'src/imx708*.zig', 'native/imx708_control.hpp', 'tests/imx708_ioctl.cpp', '.github/workflows/home-sensor-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', '0.18.0-dev.567+7f0281900']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - name: Portable sensor layout and outcome helpers
        shell: bash
        run: |
          set -euo pipefail
          for mode in Debug ReleaseSafe; do
            for helper in manager_gate sensor_node boolean_control; do
              zig test -O "$mode" "src/home/$helper.zig"
            done
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: home-lang/home
          ref: 7f627cc595998756db5fe3f8bc0367a36fe7da43
          path: .home-sensor-upstream
          sparse-checkout: packages/video
          persist-credentials: false
      - name: Exact upstream public video API and verbatim copies
        shell: bash
        run: |
          set -euo pipefail
          for helper in manager_gate sensor_node boolean_control; do
            cmp "src/home/$helper.zig" ".home-sensor-upstream/packages/video/src/core/$helper.zig"
          done
          for mode in Debug ReleaseSafe; do
            zig test -O "$mode" --dep video -Mroot=.home-sensor-upstream/packages/video/tests/sensor_helpers.zig -Mvideo=.home-sensor-upstream/packages/video/src/video.zig
          done
      - name: Logical native scope ownership on camera compiler
        if: matrix.zig == '0.15.2'
        shell: bash
        run: |
          set -euo pipefail
          for mode in Debug ReleaseSafe; do
            zig test -O "$mode" -lc -Iinclude src/sensor_layout.zig
          done
      - name: Linux ioctl ABI without physical camera
        if: runner.os == 'Linux'
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Inative tests/imx708_ioctl.cpp -o /tmp/imx708-ioctl-test
          /tmp/imx708-ioctl-test
