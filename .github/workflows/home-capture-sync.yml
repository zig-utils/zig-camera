name: Home capture synchronization
on:
  push:
    branches: [main]
    paths: ['src/home/frame_barrier.zig', 'src/capture_filter.zig', 'include/zig_camera.h', '.github/workflows/home-capture-sync.yml']
  pull_request:
    paths: ['src/home/frame_barrier.zig', 'src/capture_filter.zig', 'include/zig_camera.h', '.github/workflows/home-capture-sync.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', 'master']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - name: Request-local readiness, drops and exact timing
        shell: bash
        run: |
          set -euo pipefail
          zig test -lc -O Debug src/home/frame_barrier.zig
          zig test -lc -O ReleaseSafe src/home/frame_barrier.zig
      - name: Camera filter ABI on the pinned camera compiler
        if: matrix.zig == '0.15.2'
        shell: bash
        run: |
          set -euo pipefail
          zig test -lc -I include -O Debug src/capture_filter.zig
          zig test -lc -I include -O ReleaseSafe src/capture_filter.zig
