name: Home image resampling
on:
  push:
    branches: [main]
    paths: ['src/home/pixel_view.zig', 'src/home/pixel_resample.zig', 'include/zig_camera.h', 'tests/resample_*', '.github/workflows/home-resample.yml']
  pull_request:
    paths: ['src/home/pixel_view.zig', 'src/home/pixel_resample.zig', 'include/zig_camera.h', 'tests/resample_*', '.github/workflows/home-resample.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resampling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', '0.18.0-dev.567+7f0281900']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - name: Native precision and independent 2D reference
        shell: bash
        run: |
          set -euo pipefail
          for mode in Debug ReleaseSafe; do
            zig test -O "$mode" -lc src/home/pixel_resample.zig
            zig build-obj -O "$mode" -fcompiler-rt -lc --dep resample -Mroot=tests/resample_fixture.zig -Mresample=src/home/pixel_resample.zig -femit-bin=/tmp/home-resample.o
            cc -std=c11 -O2 -Wall -Wextra -Werror tests/resample_reference.c /tmp/home-resample.o -lm -o /tmp/home-resample
            /tmp/home-resample
          done
