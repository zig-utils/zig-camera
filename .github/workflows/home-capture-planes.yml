name: Home capture planes
on:
  push:
    branches: [main]
    paths: ['src/home/plane_pack.zig', '.github/workflows/home-capture-planes.yml']
  pull_request:
    paths: ['src/home/plane_pack.zig', '.github/workflows/home-capture-planes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', 'master']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - name: Atomic heterogeneous copies and overflow bounds
        shell: bash
        run: |
          set -euo pipefail
          zig test -lc -O Debug src/home/plane_pack.zig
          zig test -lc -O ReleaseSafe src/home/plane_pack.zig
