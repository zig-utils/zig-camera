name: Home KMS display
on:
  push:
    branches: [main]
    paths: ['src/home/kms*.zig', 'src/home/rgba_view.zig', 'src/drm_discovery.zig', 'tests/drm*', 'tests/ts/drm-discovery.test.ts', 'tests/ts/check-drm-kms.ts', '.github/workflows/home-kms-discovery.yml']
  pull_request:
    paths: ['src/home/kms*.zig', 'src/home/rgba_view.zig', 'src/drm_discovery.zig', 'tests/drm*', 'tests/ts/drm-discovery.test.ts', 'tests/ts/check-drm-kms.ts', '.github/workflows/home-kms-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', '0.18.0-dev.567+7f0281900']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: home-lang/home
          ref: 7f627cc595998756db5fe3f8bc0367a36fe7da43
          path: .home-kms-upstream
          sparse-checkout: |
            packages/video
            packages/image
          persist-credentials: false
      - name: Verify shared sources and portable catalog fault coverage
        shell: bash
        run: |
          set -euo pipefail
          for file in kms_catalog kms_discovery kms_discovery_host kms_discovery_test kms_scanout kms_scanout_host; do
            cmp ".home-kms-upstream/packages/video/src/display/$file.zig" "src/home/$file.zig"
          done
          cmp .home-kms-upstream/packages/image/src/ops/rgb16_view.zig src/home/rgb16_view.zig
          cmp .home-kms-upstream/packages/image/src/ops/rgba_view.zig src/home/rgba_view.zig
          for mode in Debug ReleaseSafe; do
            zig test -O "$mode" src/home/rgba_view.zig
            zig test -O "$mode" .home-kms-upstream/packages/image/src/ops/rgba_view.zig
            zig test -O "$mode" src/home/rgb16_view.zig
            zig test -O "$mode" .home-kms-upstream/packages/image/src/ops/rgb16_view.zig
            zig test -lc -O "$mode" --dep video -Mroot=.home-kms-upstream/packages/video/tests/kms_exports.zig -Mvideo=.home-kms-upstream/packages/video/src/video.zig
            zig test -O "$mode" src/home/kms_scanout.zig
            zig test -O "$mode" .home-kms-upstream/packages/video/src/display/kms_scanout.zig
            zig test -O "$mode" src/home/kms_discovery_test.zig
            zig test -O "$mode" .home-kms-upstream/packages/video/src/display/kms_discovery_test.zig
            if [ '${{ matrix.zig }}' = '0.15.2' ]; then
              zig test -O "$mode" -lc .home-kms-upstream/packages/video/src/kms_host.zig
              zig test -O "$mode" -lc src/home/kms_scanout_host.zig
              zig test -O "$mode" -lc .home-kms-upstream/packages/video/src/display/kms_scanout_host.zig
              zig test -O "$mode" -lc src/home/kms_discovery_host.zig
              zig test -O "$mode" -lc .home-kms-upstream/packages/video/src/display/kms_discovery_host.zig
            fi
          done
