name: Home KMS discovery
on:
  push:
    branches: [main]
    paths: ['src/home/kms*.zig', 'src/drm_discovery.zig', 'tests/drm*', 'tests/ts/drm-discovery.test.ts', 'tests/ts/check-drm-kms.ts', '.github/workflows/home-kms-discovery.yml']
  pull_request:
    paths: ['src/home/kms*.zig', 'src/drm_discovery.zig', 'tests/drm*', 'tests/ts/drm-discovery.test.ts', 'tests/ts/check-drm-kms.ts', '.github/workflows/home-kms-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', master]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: home-lang/home
          ref: 89c34efbad589a538b86d6fb07d989be17637393
          path: .home-kms-upstream
          sparse-checkout: packages/video
          persist-credentials: false
      - name: Verify shared sources and portable catalog fault coverage
        shell: bash
        run: |
          set -euo pipefail
          for file in kms_catalog kms_discovery kms_discovery_host kms_discovery_test; do
            cmp ".home-kms-upstream/packages/video/src/display/$file.zig" "src/home/$file.zig"
          done
          for mode in Debug ReleaseSafe; do
            zig test -O "$mode" src/home/kms_discovery_test.zig
            zig test -O "$mode" .home-kms-upstream/packages/video/src/display/kms_discovery_test.zig
            if [ '${{ matrix.zig }}' = '0.15.2' ]; then
              zig test -O "$mode" -lc src/home/kms_discovery_host.zig
              zig test -O "$mode" -lc .home-kms-upstream/packages/video/src/display/kms_discovery_host.zig
            fi
          done
