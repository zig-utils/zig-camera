name: Home media allocation budgets
on:
  push:
    branches: [main]
    paths: ['src/home/budget_allocator.zig', 'src/home/zlib_stream.zig', '.github/workflows/home-media-budget.yml']
  pull_request:
    paths: ['src/home/budget_allocator.zig', 'src/home/zlib_stream.zig', '.github/workflows/home-media-budget.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  budget:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', '0.18.0-dev.567+7f0281900']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - name: Native zlib dependency
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            brew install zlib
            echo "ZLIB_TEST_PREFIX=$(brew --prefix zlib)" >> "$GITHUB_ENV"
          else
            sudo apt-get update && sudo apt-get install -y zlib1g-dev
            echo "ZLIB_TEST_PREFIX=/usr" >> "$GITHUB_ENV"
          fi
      - name: Budget accounting ownership transfer and native workspace failure cleanup
        shell: bash
        run: |
          set -euo pipefail
          for mode in Debug ReleaseSafe; do
            zig test -O "$mode" src/home/budget_allocator.zig
            zig test -O "$mode" -lc -lz -L"$ZLIB_TEST_PREFIX/lib" -rpath "$ZLIB_TEST_PREFIX/lib" src/home/zlib_stream.zig
          done
