name: Home capture allocation ownership
on:
  push:
    branches: [main]
    paths: ['src/home/capture_*.zig', 'src/home/lease_pool.zig', 'src/home/owned_admission.zig', 'src/capture_allocator.zig', 'src/capture_factory.zig', 'src/capture_open_*.zig', 'src/home/factory_handoff.zig', 'src/home/thread_attachment.zig', 'tests/capture_backing*', '.github/workflows/home-capture-allocation.yml']
  pull_request:
    paths: ['src/home/capture_*.zig', 'src/home/lease_pool.zig', 'src/home/owned_admission.zig', 'src/capture_allocator.zig', 'src/capture_factory.zig', 'src/capture_open_*.zig', 'src/home/factory_handoff.zig', 'src/home/thread_attachment.zig', 'tests/capture_backing*', '.github/workflows/home-capture-allocation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', '0.18.0-dev.567+7f0281900']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: home-lang/home
          ref: 7f627cc595998756db5fe3f8bc0367a36fe7da43
          path: .home-allocation-upstream
          sparse-checkout: |
            packages/video
            packages/async
            packages/io
          persist-credentials: false
      - name: Verify shared allocation policy and ownership failure coverage
        shell: bash
        run: |
          set -euo pipefail
          for file in capture_allocation capture_objects capture_backing capture_dma_heap capture_import_linux capture_host lease_pool owned_admission; do
            cmp ".home-allocation-upstream/packages/video/src/core/$file.zig" "src/home/$file.zig"
          done
          cmp .home-allocation-upstream/packages/video/tests/capture_backing_fixture.zig tests/capture_backing_fixture.zig
          cmp .home-allocation-upstream/packages/video/tests/capture_backing_linux.c tests/capture_backing_linux.c
          cmp .home-allocation-upstream/packages/async/src/factory_handoff.zig src/home/factory_handoff.zig
          cmp .home-allocation-upstream/packages/io/src/thread_attachment.zig src/home/thread_attachment.zig
          zig fmt --check src/home/capture_allocation.zig src/home/factory_handoff.zig src/home/thread_attachment.zig
          for mode in Debug ReleaseSafe ReleaseFast; do
            zig test -lc -O "$mode" src/home/factory_handoff.zig
            zig test -lc -O "$mode" src/home/thread_attachment.zig
            zig test -lc -O "$mode" .home-allocation-upstream/packages/async/src/factory_handoff.zig
            zig test -lc -O "$mode" .home-allocation-upstream/packages/io/src/thread_attachment.zig
            zig test -O "$mode" src/home/capture_allocation.zig
            zig test -O "$mode" .home-allocation-upstream/packages/video/src/core/capture_allocation.zig
            zig test -lc -O "$mode" src/home/capture_backing.zig
            zig test -lc -O "$mode" .home-allocation-upstream/packages/video/src/core/capture_backing.zig
            if [ "$RUNNER_OS" = Linux ] && [ '0.15.2' = '${{ matrix.zig }}' ]; then
              zig test -lc -O "$mode" src/home/capture_dma_heap.zig
              zig test -lc -O "$mode" .home-allocation-upstream/packages/video/src/core/capture_dma_heap.zig
              zig build-obj -O "$mode" -fPIC -fcompiler-rt -lc --dep backing -Mroot=tests/capture_backing_fixture.zig -Mbacking=src/home/capture_host.zig -femit-bin=/tmp/capture-backing.o
              cc -std=c11 -O2 -Wall -Wextra -Werror tests/capture_backing_linux.c /tmp/capture-backing.o -o /tmp/capture-backing
              /tmp/capture-backing
            fi
            zig test -O "$mode" --dep video -Mroot=.home-allocation-upstream/packages/video/tests/capture_allocation_exports.zig -Mvideo=.home-allocation-upstream/packages/video/src/video.zig
          done
