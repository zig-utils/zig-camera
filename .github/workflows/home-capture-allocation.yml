name: Home capture allocation ownership
on:
  push:
    branches: [main]
    paths: ['src/home/capture_allocation.zig', 'src/home/lease_pool.zig', 'src/home/owned_admission.zig', '.github/workflows/home-capture-allocation.yml']
  pull_request:
    paths: ['src/home/capture_allocation.zig', 'src/home/lease_pool.zig', 'src/home/owned_admission.zig', '.github/workflows/home-capture-allocation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', master]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: home-lang/home
          ref: ac27dba288a22785aa062a197b81129cb01b6ef8
          path: .home-allocation-upstream
          sparse-checkout: packages/video
          persist-credentials: false
      - name: Verify shared allocation policy and ownership failure coverage
        shell: bash
        run: |
          set -euo pipefail
          for file in capture_allocation lease_pool owned_admission; do
            cmp ".home-allocation-upstream/packages/video/src/core/$file.zig" "src/home/$file.zig"
          done
          zig fmt --check src/home/capture_allocation.zig
          for mode in Debug ReleaseSafe ReleaseFast; do
            zig test -O "$mode" src/home/capture_allocation.zig
            zig test -O "$mode" .home-allocation-upstream/packages/video/src/core/capture_allocation.zig
            zig test -O "$mode" --dep video -Mroot=.home-allocation-upstream/packages/video/tests/capture_allocation_exports.zig -Mvideo=.home-allocation-upstream/packages/video/src/video.zig
          done
