name: Home capture delay
on:
  push:
    branches: [main]
    paths: ['src/home/relative_delay.zig', 'src/capture_delay.zig', 'include/zig_camera.h', '.github/workflows/home-capture-delay.yml']
  pull_request:
    paths: ['src/home/relative_delay.zig', 'src/capture_delay.zig', 'include/zig_camera.h', '.github/workflows/home-capture-delay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', 'master']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - name: Relative intervals, overflow and clock regression
        shell: bash
        run: |
          set -euo pipefail
          zig test -lc -O Debug src/home/relative_delay.zig
          zig test -lc -O ReleaseSafe src/home/relative_delay.zig
      - name: Camera C ABI state on the pinned camera compiler
        if: matrix.zig == '0.15.2'
        shell: bash
        run: |
          set -euo pipefail
          zig test -lc -I include -O Debug src/capture_delay.zig
          zig test -lc -I include -O ReleaseSafe src/capture_delay.zig
