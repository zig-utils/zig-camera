name: Home serial worker
on:
  push:
    branches: [main]
    paths: ['src/home/serial_worker.zig', 'src/home/owned_admission.zig', 'src/drm_preview*.zig', 'tests/drm*', 'tests/ts/check-drm-async.ts', 'ts/drm-preview-async.ts', '.github/workflows/home-serial-worker.yml']
  pull_request:
    paths: ['src/home/serial_worker.zig', 'src/home/owned_admission.zig', 'src/drm_preview*.zig', 'tests/drm*', 'tests/ts/check-drm-async.ts', 'ts/drm-preview-async.ts', '.github/workflows/home-serial-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  serial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', master]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: home-lang/home
          ref: 10203a0bd0beb877fa64d2eff6e7155fbab7b663
          path: .home-serial-upstream
          sparse-checkout: packages/video
          persist-credentials: false
      - name: Shared ownership policy and native executor acceptance
        shell: bash
        run: |
          set -euo pipefail
          cmp src/home/owned_admission.zig .home-serial-upstream/packages/video/src/core/owned_admission.zig
          sed 's#../core/owned_admission.zig#owned_admission.zig#' .home-serial-upstream/packages/video/src/io/serial_worker.zig > /tmp/serial-worker.zig
          cmp src/home/serial_worker.zig /tmp/serial-worker.zig
          for mode in Debug ReleaseSafe; do
            zig test -O "$mode" src/home/owned_admission.zig
            zig test -O "$mode" .home-serial-upstream/packages/video/src/core/owned_admission.zig
            if [ '${{ matrix.zig }}' = '0.15.2' ]; then
              zig test -lc -O "$mode" src/home/serial_worker.zig
              zig test -lc -O "$mode" .home-serial-upstream/packages/video/src/serial_worker.zig
            fi
          done
