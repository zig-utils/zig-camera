[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "zigcamera"
version = "0.1.0"
description = "Explicit frame leases for the native zig-camera libcamera capture library"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chris Breuer"}]
[tool.setuptools.packages.find]
where = ["python"]
